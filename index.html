<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Мен кіммін?</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧭%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f2ee;
  --paper: #ffffff;
  --ink: #1b1d22;
  --soft: #646a74;
  --line: #e3e0da;
  --chip: #f8f7f4;
  --accent: #3b4fd8;
  --accent-ink: #ffffff;
  --accent-soft: #e8ebfd;
  --warm: #f0603c;
  --warm-soft: #fde9e3;
  --good: #188a55;
  --good-soft: #e1f3ea;
  --bad: #c2413a;
  --font: "Geologica", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121318; --paper: #1b1d24; --ink: #eceef3; --soft: #9da3ae; --line: #2c2f38; --chip: #22252d;
    --accent: #8796ff; --accent-ink: #10121a; --accent-soft: #252a4a; --warm: #ff8a66; --warm-soft: #3d241c;
    --good: #5ccf94; --good-soft: #193327; --bad: #f07a72; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121318; --paper: #1b1d24; --ink: #eceef3; --soft: #9da3ae; --line: #2c2f38; --chip: #22252d;
  --accent: #8796ff; --accent-ink: #10121a; --accent-soft: #252a4a; --warm: #ff8a66; --warm-soft: #3d241c;
  --good: #5ccf94; --good-soft: #193327; --bad: #f07a72; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 400 17px/1.5 var(--font);
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  min-height: 100dvh;
}
button, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 680px; margin: 0 auto; padding-block: 16px 140px; }

/* верхняя полоса прогресса */
.bar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0 12px; display: flex; align-items: center; gap: 12px; }
.bar .brand { font-weight: 800; white-space: nowrap; }
.bar .track { flex: 1; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar .fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--warm)); border-radius: 99px; transition: width .4s ease; }
.bar .pct { font-size: 13px; font-weight: 600; color: var(--soft); min-width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; }

.screen { animation: rise .35s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .screen, .opt, .pair button { animation: none !important; transition: none !important; } }

.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
h1 { font-size: clamp(34px, 9vw, 52px); line-height: 1.05; margin: 8px 0 12px; font-weight: 800; letter-spacing: -.02em; text-wrap: balance; }
h2 { font-size: clamp(24px, 6vw, 32px); line-height: 1.15; margin: 0 0 10px; font-weight: 700; text-wrap: balance; }
.lead { color: var(--soft); margin: 0 0 18px; max-width: 60ch; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 20px; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 18px 0; }
.fact { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.fact b { display: block; font-size: 22px; font-weight: 800; }
.fact span { font-size: 13px; color: var(--soft); }
.note { background: var(--accent-soft); border-radius: 16px; padding: 14px 16px; margin: 0 0 18px; font-size: 15px; }

.names { display: grid; grid-template-columns: 1fr; gap: 8px; margin: 12px 0 0; }
@media (min-width: 520px) { .names { grid-template-columns: 1fr 1fr; } }
.name { text-align: left; background: var(--paper); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; font-weight: 500; transition: border-color .15s, background .15s; }
.name[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 14px; padding: 15px 22px; font-weight: 700; font-size: 17px;
  background: var(--accent); color: var(--accent-ink); transition: transform .12s, opacity .15s; min-height: 54px; }
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .4; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.wide { width: 100%; }
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding: 12px max(16px, env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  background: linear-gradient(to top, var(--bg) 70%, transparent); }
.dock .in { max-width: 680px; margin: 0 auto; display: flex; gap: 10px; }
.dock .in .btn:last-child { flex: 1; }
.dock:empty { display: none; }

/* блок-заставка */
.intro-icon { font-size: 64px; line-height: 1; margin: 18px 0 8px; }
.part { font-size: 14px; color: var(--soft); font-weight: 600; }

/* режим «по одному» */
.qnum { font-size: 14px; color: var(--soft); font-weight: 600; margin: 8px 0 6px; font-variant-numeric: tabular-nums; }
.qtext { font-size: clamp(22px, 5.6vw, 28px); line-height: 1.25; font-weight: 700; margin: 0 0 20px; text-wrap: balance; }
.pair { display: grid; gap: 10px; }
.pair button { text-align: left; background: var(--paper); border: 2px solid var(--line); border-radius: 18px; padding: 20px 18px; font-size: 18px; font-weight: 600; line-height: 1.35;
  transition: border-color .15s, background .15s, transform .15s; min-height: 92px; display: flex; gap: 14px; align-items: center; }
.pair button .lt { flex: none; width: 34px; height: 34px; border-radius: 10px; background: var(--chip); display: grid; place-items: center; font-weight: 800; color: var(--soft); }
.pair button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); transform: scale(1.01); }
.pair button[aria-pressed="true"] .lt { background: var(--accent); color: var(--accent-ink); }
.or { text-align: center; font-size: 13px; font-weight: 700; color: var(--soft); letter-spacing: .1em; text-transform: uppercase; }
.yn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.yn button { background: var(--paper); border: 2px solid var(--line); border-radius: 18px; padding: 22px 10px; font-size: 22px; font-weight: 800; transition: border-color .15s, background .15s; }
.yn button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

/* режим «списком» */
.qs { display: flex; flex-direction: column; gap: 12px; }
.q { background: var(--paper); border: 1.5px solid var(--line); border-radius: 18px; padding: 16px; transition: border-color .2s; }
.q.miss { border-color: var(--warm); background: var(--warm-soft); }
.q.done { border-color: color-mix(in srgb, var(--good) 35%, var(--line)); }
.q .t { font-weight: 600; margin: 0 0 12px; line-height: 1.35; }
.q .t small { display: block; color: var(--soft); font-weight: 400; font-size: 14px; margin-top: 2px; }
.q .scen { font-weight: 700; font-size: 18px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opts.col { flex-direction: column; }
.opt { border: 1.5px solid var(--line); background: var(--chip); border-radius: 12px; padding: 10px 14px; font-size: 15px; font-weight: 500; text-align: left; line-height: 1.3;
  transition: border-color .15s, background .15s, color .15s; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.opt[disabled] { opacity: .45; }
.agree { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.agree .opt { text-align: center; padding: 10px 4px; font-size: 13px; }
.cnt { font-size: 13px; color: var(--soft); margin-top: 8px; }
.stem { font-weight: 700; color: var(--accent); margin: 0 0 10px; }

.slider { display: flex; align-items: center; gap: 12px; }
.slider input { flex: 1; accent-color: var(--accent); height: 32px; }
.slider .val { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-size: 20px; background: var(--chip); border: 1.5px solid var(--line); }
.slider.set .val { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--soft); margin-top: 2px; padding-right: 56px; }

textarea { width: 100%; min-height: 96px; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; background: var(--chip); resize: vertical; line-height: 1.45; }
textarea:focus { border-color: var(--accent); outline: none; }
.req { color: var(--warm); font-weight: 700; }

/* результат */
.sec { font-size: 20px; margin: 26px 0 8px; padding-top: 14px; border-top: 2px solid var(--line); }
.res-top { text-align: center; padding: 26px 20px; background: linear-gradient(135deg, var(--accent), #6a3fd0 55%, var(--warm)); color: #fff; border-radius: 24px; margin: 6px 0 14px; }
.res-top .big { font-size: 64px; line-height: 1; }
.res-top h2 { color: #fff; margin: 10px 0 6px; }
.res-top p { margin: 0 auto; max-width: 46ch; opacity: .95; }
.bars { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
.brow { display: grid; grid-template-columns: 30px 1fr 34px; align-items: center; gap: 10px; font-size: 15px; }
.brow .nm { grid-column: 2; font-weight: 600; font-size: 14px; margin-bottom: -6px; }
.brow .tr { grid-column: 2; height: 12px; background: var(--chip); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.brow .tr i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .8s ease; }
.brow .n { grid-column: 3; grid-row: 1 / span 2; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
.brow .ic { grid-row: 1 / span 2; font-size: 22px; }
.res-grid { display: grid; gap: 12px; margin-top: 12px; }
@media (min-width: 560px) { .res-grid { grid-template-columns: 1fr 1fr; } }
.mini .ic { font-size: 34px; }
.mini h3 { margin: 6px 0 4px; font-size: 20px; }
.mini p { margin: 0; color: var(--soft); font-size: 15px; }
.prof { font-size: 15px; margin-top: 10px; }
.prof b { color: var(--accent); }
.err { color: var(--bad); font-weight: 600; margin-top: 10px; }
.saved { font-size: 13px; color: var(--soft); text-align: center; margin-top: 10px; }

/* меню встреч */
.parts { display: flex; flex-direction: column; gap: 10px; margin: 8px 0 12px; }
.partc { display: flex; align-items: center; gap: 14px; text-align: left; background: var(--paper); border: 1.5px solid var(--line); border-radius: 18px; padding: 16px; transition: border-color .15s, transform .15s; }
.partc:not([disabled]):hover { border-color: var(--accent); }
.partc[disabled] { opacity: .5; cursor: default; }
.partc.done { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.partc .pi { font-size: 30px; }
.partc .pt { flex: 1; display: flex; flex-direction: column; }
.partc .pt small { color: var(--soft); font-size: 14px; }
.partc .pa { font-weight: 700; color: var(--accent); font-size: 14px; white-space: nowrap; }
.link { background: none; border: 0; color: var(--soft); text-decoration: underline; font-size: 13px; }
.hint { color: var(--soft); margin: -8px 0 14px; }
.qtext.small { font-size: 18px; color: var(--soft); font-weight: 600; margin-bottom: 12px; }
.qtext.portrait { font-size: clamp(20px, 5vw, 25px); font-weight: 600; background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }

/* пара: два утверждения и 5 кружков (как у Gallup) */
.bip { display: flex; flex-direction: column; gap: 14px; }
.bip .side { background: var(--paper); border: 2px solid var(--line); border-radius: 18px; padding: 16px 16px 16px 14px; font-size: 18px; font-weight: 600; line-height: 1.35; display: flex; gap: 12px; align-items: center; }
.bip .side.a { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.bip .side.b { border-color: color-mix(in srgb, var(--warm) 45%, var(--line)); }
.bip .lt { flex: none; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-weight: 800; color: #fff; }
.bip .a .lt { background: var(--accent); } .bip .b .lt { background: var(--warm); }
.dots { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px; }
.dot { width: var(--s); height: var(--s); border-radius: 50%; border: 3px solid var(--line); background: var(--paper); transition: transform .15s, background .15s; }
.dot.d0, .dot.d1 { border-color: var(--accent); } .dot.d3, .dot.d4 { border-color: var(--warm); } .dot.d2 { border-color: var(--soft); }
.dot:active { transform: scale(.9); }
.dot[aria-pressed="true"].d0, .dot[aria-pressed="true"].d1 { background: var(--accent); }
.dot[aria-pressed="true"].d3, .dot[aria-pressed="true"].d4 { background: var(--warm); }
.dot[aria-pressed="true"].d2 { background: var(--soft); }
.dot-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--soft); margin-top: -8px; padding: 0 4px; }

/* шкала 0–10 */
.scale { display: grid; grid-template-columns: repeat(11, 1fr); gap: 4px; }
.sc { border: 1.5px solid var(--line); background: var(--paper); border-radius: 10px; padding: 12px 0; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; min-width: 0; }
.sc:nth-child(-n+5) { color: color-mix(in srgb, var(--warm) 80%, var(--ink)); }
.sc:nth-child(n+7) { color: color-mix(in srgb, var(--accent) 80%, var(--ink)); }
.sc[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.scale-ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--soft); margin-top: 6px; gap: 6px; }
@media (max-width: 380px) { .sc { font-size: 13px; padding: 10px 0; border-radius: 8px; } .scale { gap: 3px; } }

/* выбор-сеткой (метафоры) */
.grid-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.gopt { background: var(--paper); border: 2px solid var(--line); border-radius: 16px; padding: 14px 12px; font-size: 16px; font-weight: 600; text-align: left; line-height: 1.3; min-height: 64px; transition: border-color .15s, background .15s; }
.gopt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

/* карточки суперсил */
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (min-width: 560px) { .cards { grid-template-columns: 1fr 1fr 1fr; } }
.card-opt { display: flex; flex-direction: column; gap: 2px; padding: 12px; border-radius: 14px; }
.card-opt .ci { font-size: 24px; }
.card-opt small { font-weight: 400; font-size: 12.5px; opacity: .85; }
.opt.skip { font-style: italic; }
.sent { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; background: var(--chip); font-size: 16px; }
.sent:focus { border-color: var(--accent); outline: none; }
.q-sent .t { font-weight: 700; margin-bottom: 8px; }
.cnt.err { color: var(--warm); font-weight: 700; }

/* результаты */
.card h3 { margin: 0 0 12px; }
.res-grid + .card, .card + .card { margin-top: 12px; }
.powers { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pw { background: var(--accent-soft); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; }
.pw span { font-size: 26px; } .pw small { color: var(--soft); font-size: 13px; }
.trait { margin-bottom: 12px; }
.trait .tn { display: flex; justify-content: space-between; }
.trait .tr { display: block; height: 10px; background: var(--chip); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); margin: 4px 0; }
.trait .tr i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--warm)); border-radius: 99px; }
.trait p { margin: 0; font-size: 15px; color: var(--soft); }
.vals { margin: 0; padding-left: 22px; font-size: 18px; font-weight: 600; line-height: 1.7; }
.letter p { font-size: 17px; line-height: 1.6; margin: 0 0 12px; }
.letter .sign { text-align: right; color: var(--soft); font-style: italic; }
.screen.quick { animation-duration: .2s; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="dock" id="dock"></div>
<script src="config.js"></script>
<script src="data.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
